manifest_version: 2
coordinate: heavenbase/backends/file
version: 0.1.2.3
compatibility: {heavenbase: {min: 0.1.2.3, before: 0.1.3.0}}
bundle: backend-file
items:
  - kind: backend_type
    identifier: file
    aliases: [FileBackend]
    name: File Backend
    desc: Base folder-backed Backend.
    source: python-import
    target: heavenbase.backends.file.base:FileBackend
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      factory: null
      tags:
        portable: true
        storage-roles: [row, text]
        row-lookup: {get_many: native, exists_many: native, count: native}
        scalar-index:
          value: true
          unique: true
          composite: false
          composite_unique: true
          opt_out: true
          supported_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
          default_types: []
        compare-upsert: process
  - kind: backend_type
    identifier: json
    aliases: [JsonFileBackend]
    name: JSON file Backend
    desc: JSON folder-backed Backend.
    source: python-import
    target: heavenbase.backends.file.json:JsonFileBackend
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      factory: null
      tags:
        portable: true
        storage-roles: [row, text]
        row-lookup: {get_many: native, exists_many: native, count: native}
        binary-storage: base64
        scalar-index:
          value: true
          unique: true
          composite: false
          composite_unique: true
          opt_out: true
          supported_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
          default_types: []
        compare-upsert: process
  - kind: backend_type
    identifier: pickle
    aliases: [PickleFileBackend]
    name: Pickle file Backend
    desc: Pickle folder-backed Backend.
    source: python-import
    target: heavenbase.backends.file.pickle:PickleFileBackend
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      factory: null
      tags:
        portable: true
        storage-roles: [row, text]
        row-lookup: {get_many: native, exists_many: native, count: native}
        scalar-index:
          value: true
          unique: true
          composite: false
          composite_unique: true
          opt_out: true
          supported_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
          default_types: []
        compare-upsert: process
