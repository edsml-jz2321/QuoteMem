manifest_version: 2
coordinate: heavenbase/backends/inmem
version: 0.1.2.3
compatibility: {heavenbase: {min: 0.1.2.3, before: 0.1.3.0}}
bundle: backend-inmem
items:
  - kind: backend_type
    identifier: inmem
    aliases: [memory, InMemBackend]
    name: In-memory Backend
    desc: In-process reference Backend.
    source: python-import
    target: heavenbase.backends.inmem.backend:InMemBackend
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      factory: null
      tags:
        portable: true
        storage-roles: [row, text, vector]
        vector: true
        row-lookup: {get_many: native, exists_many: native, count: native}
        scalar-index:
          value: true
          unique: true
          composite: false
          composite_unique: true
          opt_out: true
          supported_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
          default_types: []
        compare-upsert: process
        atomic-upsert: true
  - kind: handler
    identifier: inmem
    groups: {backend: [inmem]}
    name: InMem handlers
    desc: In-memory value-index compilers.
    source: inline
    target: definition
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      dependencies: [backend_type:inmem]
      definition:
        seed: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.inmem.handler:register_handlers"}
        reasons: null
