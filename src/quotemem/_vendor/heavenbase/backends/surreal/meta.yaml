manifest_version: 2
coordinate: heavenbase/backends/surreal
version: 0.1.2.3
compatibility: {heavenbase: {min: 0.1.2.3, before: 0.1.3.0}}
bundle: backend-surreal
items:
  - kind: backend_type
    identifier: surreal
    aliases: [surrealdb, SurrealBackend]
    name: SurrealDB Backend
    desc: SurrealDB multi-model Backend.
    source: python-import
    target: heavenbase.backends.surreal.backend:SurrealBackend
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      factory: null
      tags:
        portable: true
        storage-roles: [row, text, vector]
        graph: true
        vector: true
        row-lookup: {get_many: native, exists_many: native, count: native}
        binary-storage: base64
        graph-endpoint-materialization: identity_anchor
        workspace-database-namespace: true
        atomic-upsert: true
        scalar-index:
          value: true
          unique: true
          composite: true
          composite_unique: true
          opt_out: true
          supported_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
          default_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
  - kind: handler
    identifier: surreal
    groups: {backend: [surreal]}
    name: SurrealDB handlers
    desc: SurrealDB graph and filter compilers with routing reasons.
    source: inline
    target: definition
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      dependencies: [backend_type:surreal]
      definition:
        seed: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.surreal.handler:register_handlers"}
        reasons: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.surreal.handler:register_reasons"}
