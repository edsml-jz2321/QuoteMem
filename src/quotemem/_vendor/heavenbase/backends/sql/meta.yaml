        native_aggregate_ops: []
        case_insensitive_like: false
        supports_regex: false
        supports_wildcard: false
        regex_style: regexp_like
        wildcard_style: like
        side_table_json_object_style: json_object
        side_table_json_agg_style: json_group_array
        json_path_style: null
        unique_nulls_distinct: true
        fallback_like: false
        fallback_reasons: {}
        text_evidence: null
        text_filter_factory: null
        text_key_evidence: null
        text_key_factory: null

  - kind: sql_dialect
    identifier: sqlite
    name: SQLite SQL Dialect
    desc: SQLite handler, JSON path, and canonical text metadata.
    source: inline
    target: definition
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      tags: *sql_dialect_tags
      definition:
        <<: *sql_definition
        native_ops: [eq, ne, lt, lte, gt, gte, match, like, ilike, contains, starts_with, ends_with, in, regex, wildcard, get]
        native_text_ops: [eq, ne, lt, lte, gt, gte, in, contains, starts_with, ends_with]
        native_text_key_ops: [group, distinct, order]
        native_aggregate_ops: [count, min, max]
        case_insensitive_like: true
        supports_wildcard: true
        wildcard_style: glob
        json_path_style: json1
        fallback_like: true
        fallback_reasons:
          ilike: SQLite handles ILIKE through a lower() SQL workaround.
          like: SQLite LIKE is case-insensitive by default; using Python scan for case-sensitive behavior.
          regex: SQLite does not support REGEXP without a user-defined function; using Python scan fallback.
        text_evidence: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.sql.parity.sqlite:text_evidence"}
        text_filter_factory: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.sql.parity.sqlite:text_filter"}
        text_key_evidence: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.sql.parity.sqlite:text_key_evidence"}
