  - kind: database_dialect
    identifier: duckdb
    groups: {sqlglot: [duckdb]}
    name: DuckDB Database Dialect
    desc: DuckDB physical types, local lifecycle, and reflection metadata.
    source: inline
    target: definition
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      tags:
        <<: *database_dialect_tags
        database-json-native: true
        database-blob-native: true
        database-local-path: true
        database-create: true
        database-drop: true
      definition:
        requires_host: false
        supports_memory: true
        memory_pool_class: static
        json_native_type: json
        name_warning_dialect_factory: [duckdb_engine, Dialect]
        current_database_sql: SELECT current_database() AS name
        column_reflection_sql: DESCRIBE {table_name}
        # The primary key's columns in declared order (PRAGMA table_info lists them in table column order).
        # The schema is unqualified or, as duckdb-engine names it from DuckDB 0.7 on, "<database>.<schema>" in any of
        # its quotings. DuckDB before 0.7 has one database and no database_name column: there each subquery's
        # database_name binds to the outer single_database row, so its database test always holds.
        primary_key_reflection_sql: >-
          SELECT name, true AS pk FROM (SELECT unnest(k.constraint_column_names) AS name, generate_subscripts(k.constraint_column_names, 1) AS ordinal
          FROM duckdb_constraints() AS k, (SELECT current_database() AS database_name) AS single_database
          WHERE k.constraint_type = 'PRIMARY KEY' AND k.table_name = {table_literal} AND k.table_oid IN (SELECT table_oid FROM duckdb_constraints() WHERE
          database_name = current_database() AND schema_name = coalesce({schema_literal}, current_schema())
          OR {schema_literal} IN (database_name || '.' || schema_name, '"' || replace(database_name, '"', '""') || '".' || schema_name,
          database_name || '."' || replace(schema_name, '"', '""') || '"', '"' || replace(database_name, '"', '""') || '"."' || replace(schema_name, '"', '""') || '"'))) AS key_columns
          ORDER BY ordinal
        index_reflection_sql: >-
          SELECT i.index_name AS name, i.is_unique AS "unique", i.expressions AS columns, i.sql AS definition
          FROM duckdb_indexes() AS i, (SELECT current_database() AS database_name) AS single_database
          WHERE i.table_name = {table_literal} AND i.index_oid IN (SELECT index_oid FROM duckdb_indexes() WHERE
          database_name = current_database() AND schema_name = coalesce({schema_literal}, current_schema())
          OR {schema_literal} IN (database_name || '.' || schema_name, '"' || replace(database_name, '"', '""') || '".' || schema_name,
          database_name || '."' || replace(schema_name, '"', '""') || '"', '"' || replace(database_name, '"', '""') || '"."' || replace(schema_name, '"', '""') || '"'))
        empty_foreign_keys_on_reflection_error: true

