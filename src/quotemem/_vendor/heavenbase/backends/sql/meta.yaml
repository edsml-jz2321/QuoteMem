          like: MySQL LIKE behaviour depends on collation.
          wildcard: MySQL LIKE collation is ambiguous for case-sensitive wildcard; using Python scan fallback.
        text_evidence: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.sql.parity.mysql:text_evidence"}
        text_filter_factory: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.sql.parity.mysql:text_filter"}

