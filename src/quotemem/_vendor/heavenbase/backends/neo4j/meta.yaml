manifest_version: 2
coordinate: heavenbase/backends/neo4j
version: 0.1.2.3
compatibility: {heavenbase: {min: 0.1.2.3, before: 0.1.3.0}}
bundle: backend-neo4j
items:
  - kind: backend_type
    identifier: neo4j
    aliases: [Neo4jBackend]
    name: Neo4j Backend
    desc: Neo4j graph Backend.
    source: python-import
    target: heavenbase.backends.neo4j.backend:Neo4jBackend
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      factory: null
      tags:
        portable: true
        storage-roles: [row, vector]
        graph: true
        vector: true
        row-lookup: {get_many: native, exists_many: native, count: native}
        binary-storage: base64
        graph-traversal-native: true
        graph-endpoint-pushdown: true
        graph-endpoint-materialization: identity_anchor
        graph-incoming-lookup-native: true
        atomic-upsert: true
        scalar-index:
          value: true
          unique: true
          composite: true
          composite_unique: false
          opt_out: true
          supported_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
          default_types: [boolean, categorical, date, duration, float, identifier, integer, long-text, medium-text, short-text, timestamp]
  - kind: handler
    identifier: neo4j
    groups: {backend: [neo4j]}
    name: Neo4j handlers
    desc: Neo4j graph and filter compilers with routing reasons.
    source: inline
    target: definition
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      dependencies: [backend_type:neo4j]
      definition:
        seed: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.neo4j.handler:register_handlers"}
        reasons: {kind: heavenbase.executable, version: 1, source: python-import, target: "heavenbase.backends.neo4j.handler:register_reasons"}
