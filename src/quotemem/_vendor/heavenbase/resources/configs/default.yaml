heavenbase:
    cli:
        backend: typer
        debug_errors: false
    dashboard:
        host: 127.0.0.1
        port: 42777
        open: true
        preferences:
            configured: false
            theme: theme-light
            language: en
            font: default
            font_scale: default
        assistant:
            desc: Chat model behind the dashboard AI assistant.
            preset: chat
            read_only: true
            share_credentials: false
            # Bounded defaults preserve the ordinary dashboard contract;
            # larger context/evidence policies are explicit operator choices.
            max_frames: 5
            max_tool_result_chars: 6000
            max_query_rows: 100
            max_group_rows: 1000
            max_tool_turns: 8
            history_turns: 40
            # Cross-turn evidence carry is opt-in; 0 preserves prose-only replay.
            evidence_total: 0
            evidence_turn_chars: 200000
            evidence_brief_chars: 1500
            # Set a positive assembled-request character threshold to compact
            # old replay turns; 0 keeps ordinary bounded replay.
            history_chars: 0
            compact_chars: 4000
            # In-turn compaction is dashboard policy; generic LLM calls remain
            # behavior-neutral unless their caller opts in.
            compact_ratio: 0.92
            # Set a positive character count to clip each captured tool result.
            result_capture_chars: 0
            run_python: false
            # External MCP servers imported through the shared FastMCP adapter.
            # Each entry needs a name and either url or command;
            # allowlist and read_only are optional.
            mcp_servers: []
            # Durable per-turn session log: agent-trace event rows (the
            # authoritative record of every provider-bound request) plus an
            # agent-session/agent-message projection, in a dedicated log
            # workspace. OFF by default: a stock install never writes model
            # traffic to disk until an operator sets `session_log: true`; the
            # reply/history contract is the same either way.
            session_log: false
            session_log_workspace: assistant-log
            # The log never trusts preset fallback (the debug preset is
            # in-memory); its backend is declared here like llm.cache.
            session_log_backend:
                main:
                    type: sqlite
                    name: main
                    database: "file://%/assistant/session-log.db"
            # Whole-session cap enforced when a new conversation opens;
            # 0 keeps every session.
            session_log_max_sessions: 256
            # get_config can hand raw credentials to the model when
            # share_credentials is on; logging would persist them at rest,
            # so the combination is refused unless explicitly accepted here.
            session_log_allow_credentials: false
    registry:
        default_workspace: default
        active:
            workspace: null
        workspaces: {}
    config:
        versioning:
            keep_last_k: 10
        refresh_interval: 2.0
        cache:
            max_snapshots: 65536
            max_generations: 65536
            max_resolved: 1024
            max_applied: 1024
    log:
        level: INFO
        sink: stream
        file: null
        suppress: false
        format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
        stream_format: "%(levelname)s:%(name)s:%(message)s"
    parallel:
        max_workers: null
        fallback_max_workers: 32
        cpu_extra_workers: 4
    serialize:
        encoding: utf-8
        indent: 4
    rng:
        hash_function: crc32
        hash_modulo: 1061109589
    auto_register: true
    demos:
        run_llm: "${env:HVNB_RUN_LLM_DEMO,0}"
    extensions:
        default:
            - toolkit
            - prompt
            - agent
    entity:
        id:
            hash_length: 42
    db:
        local_root: "file://%/database"
        default_preset: default
        default_provider: sqlite
        presets:
            default:
                provider: sqlite
        default_args:
            http_proxy: null
            https_proxy: null
            no_proxy: null
            sql_healing:
                aggressiveness: balanced
                prefer_backticks: true
        providers:
            sqlite:
                dialect: sqlite
                driver: pysqlite
                database: default.db
                # Vector storage form. Unset keeps JSON text, which every release
                # reads. `float64_blob` (opt-in) packs each vector as a little-endian
                # float64 BLOB: smaller, faster to decode, bit-exact, and still able
                # to read JSON text rows; HeavenBase 0.1.2.2 and earlier cannot read
                # a packed row, and nothing converts packed rows back. Only SQLite
                # (dynamically typed columns) accepts it; other dialects refuse it.
                # vector_packed_type: float64_blob
                pragmas:
                    - "PRAGMA foreign_keys = ON;"
                    - "PRAGMA journal_mode = WAL;"
                    - "PRAGMA synchronous = NORMAL;"
                    - "PRAGMA busy_timeout = 6000;"
                lock_retry:
                    attempts: 8
                    base_delay: 0.02
                    max_delay: 0.25
                pool:
                    pool_class: queue
                    connect_args:
                        check_same_thread: false
                        timeout: 6.0
                    pool_pre_ping: true
                    pool_size: 5
                    max_overflow: 10
                    pool_timeout: 30
                    pool_recycle: 3600
            duckdb:
                dialect: duckdb
                schema: main
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 5
                    max_overflow: 10
                    pool_timeout: 30
                    pool_recycle: 3600
            postgres:
                aliases: [pg]
                dialect: postgresql
                driver: psycopg2
                host: localhost
                port: 5432
                username: postgres
                schema: public
                params:
                    sslmode: prefer
                superuser:
                    database: postgres
                    schema: public
                    params:
                        sslmode: prefer
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 5
                    max_overflow: 10
                    pool_timeout: 30
                    pool_recycle: 3600
            supabase:
                dialect: postgresql
                infer_from_url: false
                driver: psycopg2
                host: localhost
                port: 5432
                username: postgres
                database: postgres
                schema: public
                params:
                    sslmode: require
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 5
                    max_overflow: 10
                    pool_timeout: 30
                    pool_recycle: 3600
            mysql:
                dialect: mysql
                driver: pymysql
                host: localhost
                port: 3306
                username: root
                params:
                    charset: utf8mb4
                superuser:
                    database: mysql
                    params:
                        charset: utf8mb4
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 3
                    max_overflow: 2
                    pool_timeout: 30
                    pool_recycle: 1800
            seekdb:
                dialect: mysql
                driver: pymysql
                host: localhost
                port: 2881
                username: root
                params:
                    charset: utf8mb4
                superuser:
                    database: mysql
                    params:
                        charset: utf8mb4
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 3
                    max_overflow: 2
                    pool_timeout: 30
                    pool_recycle: 1800
            dolt:
                dialect: mysql
                driver: pymysql
                host: localhost
                port: 3306
                username: root
                params:
                    charset: utf8mb4
                superuser:
                    database: mysql
                    params:
                        charset: utf8mb4
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 3
                    max_overflow: 2
                    pool_timeout: 30
                    pool_recycle: 1800
            oceanbase:
                dialect: mysql
                driver: pymysql
                host: localhost
                port: 2881
                username: root
                params:
                    charset: utf8mb4
                superuser:
                    database: mysql
                    params:
                        charset: utf8mb4
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 3
                    max_overflow: 2
                    pool_timeout: 30
                    pool_recycle: 1800
            mssql:
                aliases: [msql, sqlserver, sql-server]
                dialect: mssql
                driver: pymssql
                host: localhost
                port: 1433
                username: sa
                schema: dbo
                superuser:
                    database: master
                    schema: dbo
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 5
                    max_overflow: 10
                    pool_timeout: 30
                    pool_recycle: 3600
            oracle:
                dialect: oracle
                driver: oracledb
                host: localhost
                port: 1521
                username: system
                service: FREEPDB1
                schema: "{username}"
                superuser:
                    service: FREEPDB1
                    schema: system
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 5
                    max_overflow: 10
                    pool_timeout: 30
                    pool_recycle: 3600
            starrocks:
                dialect: mysql
                driver: pymysql
                host: localhost
                port: 9030
                username: root
                params:
                    charset: utf8mb4
                superuser:
                    database: null
                    params:
                        charset: utf8mb4
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 3
                    max_overflow: 2
                    pool_timeout: 30
                    pool_recycle: 1800
            trino:
                dialect: trino
                catalog: memory
                host: localhost
                port: 8080
                username: trino
                schema: default
                pool:
                    pool_class: null
                    pool_pre_ping: false
                    pool_recycle: -1
            clickhouse:
                dialect: clickhousedb
                driver: connect
                database: default
                host: localhost
                port: 8123
                username: default
                password: ""
                pool:
                    pool_class: queue
                    pool_pre_ping: true
                    pool_size: 5
                    max_overflow: 10
                    pool_timeout: 30
                    pool_recycle: 3600
    query:
        warn_on_python_fallback: false
        # code_reduce evaluates a caller-supplied expression in this process
        # with no restriction. Set this to false to refuse it engine-wide.
        allow_code_reduce: true
        graph:
            max_hops: 64
        regex:
            # false rejects a group with + or * that is itself quantified, and
            # a pattern whose estimated Python re backtracking on a text of
            # max_text_chars (8192 unless set) exceeds 3e9 steps and that the
            # linear-time matcher cannot run (backreferences, lookarounds,
            # conditionals, atomic groups, possessive quantifiers, a (?u:...)
            # group inside an ASCII pattern). Other costly patterns run on
            # that matcher whatever this key says.
            allow_nested_quantifiers: false
        near:
            default_top_k: 50
            max_top_k: 1000
            default_metric: cosine
            # Rows per read batch in portable exact scans and ordinary Milvus Lite cosine scans.
            scan_batch_size: 256
            cache:
                max_bytes: 67108864
                max_entries: 16
            candidate_prefilter:
                max_ids: 4096
    search:
        default_limit: 20
        max_limit: 200
    workspace:
        default_preset: debug
        presets:
            debug:
                desc: Dependency-light local workspace for demos, smoke tests, and first-run development.
                backends:
                    main:
                        type: sqlite
                        name: main
                        database: ":memory:"
                    vec:
                        type: inmem
                        name: vec
                    search:
                        type: inmem
                        name: search
            local-lts:
                desc: Self-hosted local stack with Postgres rows, LanceDB vectors, and Elasticsearch search.
                backends:
                    main:
                        type: postgres
                        name: main
                        database: "${env:HVNB_LOCAL_LTS_POSTGRES_DB,rubik}"
                        host: "${env:HVNB_LOCAL_LTS_POSTGRES_HOST,localhost}"
                        port: "${env:HVNB_LOCAL_LTS_POSTGRES_PORT,5432}"
                        username: "${env:HVNB_LOCAL_LTS_POSTGRES_USER,rubik}"
                        password: "${env:HVNB_LOCAL_LTS_POSTGRES_PASSWORD,password}"
                        superuser:
                            username: "${env:HVNB_LOCAL_LTS_POSTGRES_SUPERUSER,rubik}"
                            password: "${env:HVNB_LOCAL_LTS_POSTGRES_SUPERUSER_PASSWORD,password}"
                            database: "${env:HVNB_LOCAL_LTS_POSTGRES_MAINTENANCE_DB,postgres}"
                            schema: public
                            params:
                                sslmode: prefer
                    vec:
                        type: lance
                        name: vec
                        uri: "file://%/workspaces/lance"
                    search:
                        type: elasticsearch
                        name: search
                        hosts:
                            - "${env:HVNB_LOCAL_LTS_ES_URL,http://localhost:9200}"
            web-lts:
                desc: Managed/cloud-shaped stack for shared development using Supabase, pgvector, and hosted search.
                backends:
                    main:
                        type: supabase
                        name: main
                        database: "${env:HVNB_WEB_LTS_POSTGRES_DB,postgres}"
                        host: "${env:HVNB_WEB_LTS_POSTGRES_HOST,localhost}"
                        port: "${env:HVNB_WEB_LTS_POSTGRES_PORT,5432}"
                        username: "${env:HVNB_WEB_LTS_POSTGRES_USER,postgres}"
                        password: '${env:HVNB_WEB_LTS_POSTGRES_PASSWORD,""}'
                        params:
                            sslmode: "${env:HVNB_WEB_LTS_POSTGRES_SSLMODE,require}"
                    vec:
                        type: pgvector
                        name: vec
                        shared_database: true
                        database: "${env:HVNB_WEB_LTS_POSTGRES_DB,postgres}"
                        host: "${env:HVNB_WEB_LTS_POSTGRES_HOST,localhost}"
                        port: "${env:HVNB_WEB_LTS_POSTGRES_PORT,5432}"
                        username: "${env:HVNB_WEB_LTS_POSTGRES_USER,postgres}"
                        password: '${env:HVNB_WEB_LTS_POSTGRES_PASSWORD,""}'
                        params:
                            sslmode: "${env:HVNB_WEB_LTS_POSTGRES_SSLMODE,require}"
                    search:
                        type: elasticsearch
                        name: search
                        hosts:
                            - "${env:HVNB_WEB_LTS_ES_URL,http://localhost:9200}"
    backends:
        main:
            type: sqlite
            name: main
            database: ":memory:"
        vec:
            type: inmem
            name: vec
    backend_defaults:
        inmem: {}
        sql:
            id_lookup:
                batch_size: 500
        sqlite: {}
        duckdb: {}
        postgres: {}
        supabase: {}
        trino: {}
        clickhouse: {}
        mysql: {}
        dolt: {}
        oceanbase: {}
        oracle: {}
        elasticsearch:
            hosts:
                - "http://localhost:9200"
            scan_limit: 10000  # scroll page size; Backend.scan remains exhaustive
            filter_limit: 10000
            timeout: 1.0
        opensearch:
            hosts:
                - "${env:HVNB_OPENSEARCH_URL,http://localhost:9201}"
            scan_limit: 10000  # scroll page size; Backend.scan remains exhaustive
            filter_limit: 10000
            timeout: 1.0
        mongodb:
            uri: "${env:HVNB_MONGODB_URI,mongodb://localhost:27017}"
            database: heavenbase
        tinydb:
            database: "file://%/tinydb.json"
        neo4j:
            url: "${env:HVNB_NEO4J_URL,bolt://localhost:7687}"
            user: "${env:HVNB_NEO4J_USER,neo4j}"
            password: "${env:HVNB_NEO4J_PASSWORD,neo4j}"
            index_timeout: "${env:HVNB_NEO4J_INDEX_TIMEOUT,60}"  # seconds ensure() waits for a vector index to come ONLINE
        surreal:
            url: "${env:HVNB_SURREAL_URL,ws://localhost:8000/rpc}"
            namespace: "${env:HVNB_SURREAL_NAMESPACE,heavenbase}"
            user: "${env:HVNB_SURREAL_USER,root}"
            password: "${env:HVNB_SURREAL_PASSWORD,root}"
            ef_search: "${env:HVNB_SURREAL_EF_SEARCH,64}"  # HNSW search breadth (EF >= K) for native cosine KNN
        redis:
            url: "${env:HVNB_REDIS_URL,redis://localhost:6379}"
            index_hash_function: crc32
            index_hash_length: 10
        redisearch:
            url: "${env:HVNB_REDIS_URL,redis://localhost:6379}"
            vector_algorithm: HNSW
            metric: cosine
            filter_limit: 10000
            index_timeout: "${env:HVNB_REDISEARCH_INDEX_TIMEOUT,5}"
            min_prefix: 2
        file:
            path: "file://%/file"
        json:
            path: "file://%/json"
        pickle:
            path: "file://%/pickle"
        lance:
            uri: "file://%/lance"
            id_lookup:
                batch_size: 500
        pgvector: {}
        milvus:
            uri: "http://localhost:19530"
            index_type: AUTOINDEX  # FLAT enables native exact near; existing indexes must match
            timeout: 1.0
            token: ""
            varchar:
                max_length: 65535
            array:
                max_capacity: 4096
                max_length: 65535
            entity_id:
                max_length: 63
            metric: COSINE
            # Batch sizes for Milvus and Milvus Lite: a Milvus server's query-iterator batch,
            # capped at 16384 rows; Milvus Lite's key-fetch batch.
            scan_limit: 10000  # Backend.scan remains exhaustive
            filter_limit: 10000  # native filters remain exhaustive
        milvus_lite:
            uri: "file://%/milvus-lite.db"
            index_type: FLAT
        qdrant:
            url: "${env:HVNB_QDRANT_URL,http://localhost:6333}"
            path: null
            api_key: null
            timeout: 5.0
        weaviate:
            url: "${env:HVNB_WEAVIATE_URL,http://localhost:8080}"
            grpc_host: null
            grpc_port: "${env:HVNB_WEAVIATE_GRPC_PORT,50051}"
            api_key: null
        chroma:
            metric: cosine
        pinecone:
            host: "http://localhost:5080"
            api_key: null
            ssl_verify: false
            metric: cosine
            serverless:
                cloud: aws
                region: us-east-1
        mssql:
            driver: pymssql
        seekdb:
            driver: pymysql
            host: localhost
            port: 2881
            username: root
            password: ""
            params:
                charset: utf8mb4
        starrocks:
            varchar:
                max_length: 65533
            driver: pymysql
            host: localhost
            port: 9030
            username: root
            password: ""
            params:
                charset: utf8mb4
            database: heavenbase
            entity_id:
                max_length: 63
            buckets: 1
            replication_num: 1
    strategy_defaults:
        sparse_gram:
            normalizer: default
            normalizer_lang: auto
            unicode_normalization: NFC
            casefold: true
            spacy_model: en_core_web_sm
            spacy_disable:
                - parser
                - ner
                - textcat
            spacy_batch_size: 256
            spacy_n_process: 1
            normalize_cache_size: 100000
            normalize_cache_persist: true
            min_length: 2
            gram_unit: char
            tokenizer: char
            tokenizer_args: {}
            gram_width: 3
            sparse_policy: cartesian-cover
            sparse_max_width: 0
            sparse_grams_per_keyword: 0
            hash_function: crc32
            hash_bits: 32
            hash_salt: heavenbase.gram.v1
            seed: 42
            posting_page_size: 10000
            hot_gram_threshold: 0
    mcp:
        log_calls: false
        transforms: []
        cache:
            enabled: false
            tools: []
            ttl: 300
            max_entries: 256
        workspace_toolkit: null
        workspace_profile: full
        display:
            max_rows: 50
            max_width: 64
        profiles:
            full:
                tools: [schema, read, write, delete, query]
                entities: "*"
                serializer: jstr
                desc: Full workspace MCP surface with schema, CRUD, query, and explain tools.
            agent:
                tools:
                    - define_entity
                    - list_entities
                    - describe_entity
                    - upsert
                    - get
                    - set
                    - count
                    - query
                    - explain
                entities: "*"
                skills: "*"
                serializer: markdown
                desc: Curated agent MCP surface with markdown-serialized reads and skill linkage.
        memory:
            default_source: agent
            list_limit: 20
            search_limit: 10
        backend_toolkit: null
        transport: http
        host: "127.0.0.1"
        port: 7001
    database:
        allow_write: false
        max_query_rows: 200
        profile:
            max_enum_values: 50
            top_values: 10
    capsule:
        namespace: default
        registry:
            workspace: executable-registry
            backend:
                main:
                    type: sqlite
                    name: main
                    database: "file://%/capsule/registry.db"
            trust:
                local_only: true
                allow_binary_payload: false
                verify_source_hash: true
                verify_cache_size: 1024
    toolkit:
        namespace: default
    prompt:
        lang: null
        main_lang: en
        elicit: none
    llm:
        default_endpoint: openai
        default_gateway: openai
        default_provider: openrouter
        default_preset: system
        model_mismatch: raise
        default_args:
            timeout: 120
            max_retries: 3
            temperature: 0
            seed: 42
            http_proxy: null
            https_proxy: null
            no_proxy: null
            enforce_non_stream_structured: false
            embedding_batch_size: 256
            embedding_max_workers: 8
        cache:
            # ON by default. The shared cache persists plaintext messages and
            # embedding inputs under the package home; set `enabled: false`
            # for a deployment, or pass `hb.LLM(..., cache=False)` per client.
            enabled: true
            workspace: llm-cache
            backend:
                main:
                    type: sqlite
                    name: main
                    database: "file://%/llm/cache.db"
            policy: deterministic
            namespaces:
                text:
                    enabled: true
                    max_entries: null
                    # Soft persistence budget for text-cache rows (bytes of compact JSON).
                    # Multimodal inputs are digested before write; oversized rows are skipped.
                    max_bytes: 4194304
                    ttl_seconds: null
                embedding:
                    enabled: true
                    max_entries: null
                    max_bytes: null
                    ttl_seconds: null
                    touch_hits: false
                image:
                    enabled: true
                    max_entries: null
                    max_bytes: null
                    ttl_seconds: null
        tool_call_repair:
            enabled: false
            strict: false
        image_url_timeout: 120
        presets:
            system:
                desc: Default lightweight system LLM for short orchestration calls.
                model: ds-flash
                default_args:
                    think: false
            local:
                desc: Local LM Studio chat preset for private offline work.
                gateway: openai
                provider: lmstudio
                model: qwen3.6-flash
                default_args:
                    think: false
            tiny:
                desc: Tiny chat model for low-latency offline work.
                model: gemma
                default_args:
                    think: false
            chat:
                desc: General chat preset for fast non-thinking answers.
                model: ds-flash
                default_args:
                    think: false
            chat-pro:
                desc: Stronger chat preset that still avoids reasoning by default.
                model: ds-pro
                default_args:
                    think: false
            reason:
                desc: Reasoning preset for harder tasks that should expose thinking when supported.
                model: ds-pro
                default_args:
                    think: true
            reason-pro:
                desc: Higher-capability reasoning preset backed by the default GPT alias.
                model: gpt
                default_args:
                    think: true
                    reasoning_effort: max
            worker:
                desc: Background worker preset for deterministic non-thinking utility calls.
                model: ds-flash
                default_args:
                    think: false
            worker-local:
                desc: Local LM Studio worker preset for deterministic offline utility calls.
                gateway: openai
                provider: lmstudio
                model: qwen3.6-flash
                default_args:
                    think: false
            coder:
                desc: Coding preset with thinking enabled for multi-step implementation work.
                model: sonnet
                default_args:
                    think: true
            coder-pro:
                desc: Highest-end coding preset for deep implementation and review work.
                model: opus
                default_args:
                    think: true
            embed:
                desc: Default embedding preset.
                gateway: openai
                model: gpt-embedding-small
            embed-local:
                desc: Local embedding preset.
                gateway: openai
                provider: lmstudio
                model: embeddinggemma
            imagen:
                desc: Default image-generation preset.
                model: gpt-image-mini
            imagen-local:
                desc: Local Ollama image-generation preset.
                gateway: openai
                provider: ollama
                model: z-image-turbo
            ocr-local:
                desc: Local Ollama OCR preset.
                gateway: openai
                provider: ollama
                model: glm-ocr
                default_args:
                    think: false
            mock:
                desc: Non-LLM deterministic mock preset for tests and demos.
                gateway: mock
                provider: mock
                model: mock
            custom:
                desc: Runtime-supplied OpenAI-compatible provider preset.
                gateway: openai
                provider: custom
                model: custom
        models:
            deepseek-v4-flash:
                aliases:
                    - ds-flash
                    - deepseek-flash
                    - deepseek-chat
                # Provider error verbatim: "This model's maximum context
                # length is 1048576 tokens" — counted over messages+completion
                # (unlike qwen's input-only limit).
                context_window: 1048576
                default_provider: openrouter
                providers:
                    openrouter:
                        model_id: deepseek/deepseek-v4-flash-0731
                    deepseek:
                        model_id: deepseek-chat
                default_args:
                    think: false
            deepseek-reasoner:
                aliases:
                    - ds-flash-thinking
                    - deepseek-flash-thinking
                default_provider: openrouter
