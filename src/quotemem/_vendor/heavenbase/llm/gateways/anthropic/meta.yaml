manifest_version: 2
coordinate: heavenbase/llm/gateways/anthropic
version: 0.1.2.3
compatibility: {heavenbase: {min: 0.1.2.3, before: 0.1.3.0}}
bundle: llm-gateway-anthropic
items:
  - kind: llm_gateway
    identifier: anthropic
    name: Anthropic LLM Gateway
    desc: Anthropic SDK transport for native Messages endpoints.
    source: inline
    target: definition
    active: true
    meta:
      schema_version: 1
      version: 0.1.2.1
      tags: {llm: true}
      definition:
        compiler: semantic/v1
        endpoints: [anthropic]
        compile: {kind: heavenbase.executable, version: 1, source: python-import, target: heavenbase.llm.gateways.anthropic.runtime:compile}
        available: {kind: heavenbase.executable, version: 1, source: python-import, target: heavenbase.llm.gateways.anthropic.runtime:available}
        chat: {kind: heavenbase.executable, version: 1, source: python-import, target: heavenbase.llm.gateways.anthropic.runtime:chat}
        achat: {kind: heavenbase.executable, version: 1, source: python-import, target: heavenbase.llm.gateways.anthropic.runtime:achat}
        client: {kind: heavenbase.executable, version: 1, source: python-import, target: heavenbase.llm.gateways.anthropic.runtime:client}
