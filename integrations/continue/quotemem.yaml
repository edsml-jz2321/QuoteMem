# Continue: QuoteMem as an MCP server. Save as .continue/mcpServers/quotemem.yaml
# (or merge the mcpServers entry into ~/.continue/config.yaml).
# Continue has no hooks that run on each message, so memory is saved and
# searched by the model through the tools, as the rule asks.
name: QuoteMem
version: 0.3.2
schema: v1
mcpServers:
  - name: quotemem
    command: quotemem-hook
    args:
      - mcp
    env:
      QUOTEMEM_AUTO: "0"
