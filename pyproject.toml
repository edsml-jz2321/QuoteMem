[project]
name = "quotemem"
version = "0.3.2"
description = "QuoteMem: auditable agent memory with quoted evidence, versioned supersession and forgetting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Quei" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "anyio==4.15.1",
  "cryptography==50.0.1",
  "httpx==0.28.1",
  "numpy==2.5.2",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0",
  "sqlalchemy==2.0.52",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "pywin32>=306; sys_platform == 'win32'",
  # What the included HeavenBase 0.1.2.3 (src/quotemem/_vendor) needs besides these.
  "anthropic>=0.105",
  "click>=8.1",
  "cloudpickle>=3.0",
  "fastmcp>=4.0.0",
  "omegaconf>=2.3",
  "openai>=1.0",
  "pandas>=1.5",
  "prompt_toolkit>=3.0",
  "typer>=0.12",
]

[project.scripts]
quotemem = "quotemem.api.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.12.12", "pyright[nodejs]==1.1.405"]
bench = ["pyarrow==25.0.1", "tiktoken==0.12.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.11.21"
constraint-dependencies = ["fastmcp-slim>=4.0.0b1"]

[tool.hatch.build.targets.wheel]
packages = ["src/quotemem"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/quotemem",
  "benchmarks/sources.json",
  "benchmarks/sources-additional.json",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/quotemem/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "src/quotemem/_vendor"]
extraPaths = ["src/quotemem/_vendor"]
typeCheckingMode = "strict"
enableExperimentalFeatures = true
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "src/quotemem/bench/mem0_oss.py"
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
