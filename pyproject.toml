[project]
name = "aml"
version = "0.1.0"
description = "QuoteMem: auditable agent memory with quoted evidence, versioned supersession and forgetting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Quei" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "anyio==4.15.1",
  "heavenbase==0.1.2.3",
  "httpx==0.28.1",
  "numpy==2.5.2",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0",
  "sqlalchemy==2.0.52",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
aml = "aml.api.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.12.12", "pyright[nodejs]==1.1.405"]
bench = ["pyarrow==25.0.1", "tiktoken==0.12.0"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.11.21"
constraint-dependencies = ["fastmcp-slim>=4.0.0b1"]

[tool.hatch.build.targets.wheel]
packages = ["src/aml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
