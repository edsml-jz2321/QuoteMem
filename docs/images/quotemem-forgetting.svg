.frame{fill:#0d1117;stroke:#3d444d}.ftitle,.t,.t12,.tb,.mono{fill:#f0f6fc}.tm,.ts,.who{fill:#9198a1}
.numbg{fill:#4493f8}.ubub{fill:#0c2d6b;stroke:#4493f8}.abub{fill:#3b2e05;stroke:#d29922}
