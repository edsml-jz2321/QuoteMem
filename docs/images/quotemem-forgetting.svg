.pick{fill:#ddf4ff;stroke:#0969da;stroke-width:1.6}
.new{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.6}
.past{fill:#eaeef2;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 3}
.gone{fill:#ffebe9;stroke:#cf222e;stroke-width:1.4;stroke-dasharray:5 3}
.pastt{font:13px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#59636e}
.gonet{font:13px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#a40e26;text-decoration:line-through}
.chipj{fill:#fbefff;stroke:#8250df;stroke-width:1}
