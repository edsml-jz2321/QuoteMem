<svg xmlns="http://www.w3.org/2000/svg" width="970" height="609" viewBox="0 0 970 609" role="img" aria-labelledby="t d">
<title id="t">Forgetting</title>
<desc id="d">Three frames. 1: a forget said in chat on 22 November forgets the appointment memory, withholds both messages about it and writes one tombstone, with that Add. 2: a forget through the API first prepares a plan that changes nothing, then confirms it: the workplace memory and the hospital-name memory are forgotten, &quot;at Ruijin Hospital&quot; is withheld in the message of 8 November, two tombstones are written and the nurse memory stays. 3: a later assistant reply names the hospital; no memory is added from it. A search for where the user works returns the nurse memory first and, fifth, the message of 8 November with the forgotten words left out.</desc>
<style>
.frame{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
.ftitle{font:bold 15px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#1f2328}
.num{font:bold 13px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#ffffff}
.numbg{fill:#0969da}
