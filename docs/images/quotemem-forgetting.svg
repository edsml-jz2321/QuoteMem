.okt{font:bold 12px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#1a7f37}
.badt{font:bold 12px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#cf222e}
.hl{fill:#fff1a6}
.redact{fill:#1f2328}
.tomb{fill:#6e7781}
.tombt{font:bold 9px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#ffffff}
.arrow{stroke:#8c959f;stroke-width:2;fill:none}
