<path class="arrow" d="M640.4 158.0L651.4 158.0" marker-end="url(#h)"/>
<rect class="gone" x="12" y="583" width="26" height="15" rx="4"/>
<text class="ts" x="44.0" y="595.0">forgotten memory</text>
<rect class="redact" x="175.6" y="584" width="26" height="13" rx="2"/>
<text class="ts" x="207.6" y="595.0">withheld words</text>
<path class="tomb" d="M329.0 598v-11a8 8 0 0 1 16 0v11z"/>
<text class="ts" x="351.0" y="595.0">tombstone</text>
<rect class="chipj" x="432.9" y="580" width="118" height="21" rx="10.5"/>
<text class="chipjt" x="491.7" y="595.0" text-anchor="middle">model&#x27;s answer</text>
</svg>
