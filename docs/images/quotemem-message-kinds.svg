<svg xmlns="http://www.w3.org/2000/svg" width="970" height="751" viewBox="0 0 970 751" role="img" aria-labelledby="t d">
<title id="t">What each kind of message does</title>
<desc id="d">Six frames, each with what the user said and what changed in the store, oldest on top. New facts: four new memories. A repeat: the nurse memory gets a second quote and version 2. Added detail: two new memories, and the nurse memory gets one more quote. A correction: the cat-name memory keeps version 1 in its history and version 2 says Max, not Bob. An update: the Beijing memory becomes past and a new memory about Shanghai is current. An event: a new event memory.</desc>
