.okt{font:bold 12px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#1a7f37}
.badt{font:bold 12px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#cf222e}
.hl{fill:#fff1a6}
.redact{fill:#1f2328}
.tomb{fill:#6e7781}
.tombt{font:bold 9px "DejaVu Sans",Verdana,Arial,Helvetica,sans-serif;fill:#ffffff}
.arrow{stroke:#8c959f;stroke-width:2;fill:none}
.head{fill:#8c959f}
.link{stroke:#1a7f37;stroke-width:1.6;fill:none;stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){
.frame{fill:#0d1117;stroke:#3d444d}.ftitle,.t,.t12,.tb,.mono{fill:#f0f6fc}.tm,.ts,.who{fill:#9198a1}
.numbg{fill:#4493f8}.ubub{fill:#0c2d6b;stroke:#4493f8}.abub{fill:#3b2e05;stroke:#d29922}
.query{fill:#0d1117;stroke:#4493f8}.card{fill:#161b22;stroke:#656c76}.pick{fill:#0c2d6b;stroke:#4493f8}
.new{fill:#0f2d1a;stroke:#3fb950}.past{fill:#21262d;stroke:#656c76}.gone{fill:#3d1418;stroke:#f85149}
.pastt{fill:#8b949e}.gonet{fill:#ff7b72}
.chipj{fill:#271052;stroke:#a371f7}.chipjt{fill:#c297ff}.chipp{fill:#161b22;stroke:#9198a1}.chippt{fill:#d1d9e0}
.okt{fill:#3fb950}.badt{fill:#f85149}.hl{fill:#5a4a00}.redact{fill:#d1d9e0}.tomb{fill:#656c76}
.arrow{stroke:#656c76}.head{fill:#656c76}.link{stroke:#3fb950}}
