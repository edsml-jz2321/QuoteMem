<text class="chipjt" x="499.9" y="513.0" text-anchor="middle">model</text>
<rect class="chipp" x="544.4" y="498" width="66" height="21" rx="10.5"/>
<text class="chippt" x="577.3" y="513.0" text-anchor="middle">program</text>
