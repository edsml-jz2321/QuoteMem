<svg xmlns="http://www.w3.org/2000/svg" width="970" height="527" viewBox="0 0 970 527" role="img" aria-labelledby="t d">
<title id="t">One Add, step by step</title>
<desc id="d">The message of 20 November, &quot;I moved from Beijing to Shanghai last month.&quot;, in six steps. 1: the message is kept word for word. 2: a model proposes a fact and copies its quote. 3: the program finds the quote at bytes 0 to 44 and turns &quot;last month&quot; into October 2026. 4: the program picks five stored memories to compare, the Beijing memory first by meaning and by words. 5: the judge model answers update for the Beijing memory, three times. 6: the Beijing memory becomes past and the new memory is current.</desc>
<style>
