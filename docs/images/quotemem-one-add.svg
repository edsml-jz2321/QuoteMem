<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="frame" x="8.0" y="8" width="308.7" height="217" rx="10"/>
<circle class="numbg" cx="28.0" cy="29" r="11"/>
<text class="num" x="28.0" y="33.5" text-anchor="middle">1</text>
<text class="ftitle" x="46.0" y="34.0">Keep the message</text>
<rect class="chipp" x="236.9" y="18" width="66" height="21" rx="10.5"/>
<text class="chippt" x="269.8" y="33.0" text-anchor="middle">program</text>
<text class="who" x="22.0" y="63.0">user · 20 Nov 09:00</text>
<rect class="ubub" x="22.0" y="68" width="281" height="50" rx="9"/>
<path class="ubub" d="M38.0 117l2 9l9-9z"/>
<text class="t" x="33.0" y="89.0">I moved from Beijing to Shanghai</text>
<text class="t" x="33.0" y="106.0">last month.</text>
<text class="tm" x="22.0" y="142.0">Stored word for word, with its</text>
<text class="tm" x="22.0" y="159.0">session and time. Every memory must</text>
<text class="tm" x="22.0" y="176.0">quote these bytes.</text>
<rect class="frame" x="330.7" y="8" width="308.7" height="217" rx="10"/>
<circle class="numbg" cx="350.7" cy="29" r="11"/>
<text class="num" x="350.7" y="33.5" text-anchor="middle">2</text>
<text class="ftitle" x="368.7" y="34.0">A model proposes facts</text>
<rect class="chipj" x="574.4" y="18" width="51" height="21" rx="10.5"/>
<text class="chipjt" x="599.9" y="33.0" text-anchor="middle">model</text>
<rect class="card" x="344.7" y="54" width="281" height="66" rx="6"/>
<text class="t" x="354.7" y="74.0">The user moved from Beijing to</text>
<text class="t" x="354.7" y="91.0">Shanghai last month.</text>
<text class="ts" x="354.7" y="108.0">kind: event · time: &quot;last month&quot;</text>
<rect class="card" x="344.7" y="126" width="281" height="49" rx="6"/>
<text class="t" x="354.7" y="146.0">quote: &quot;I moved from Beijing to</text>
<text class="t" x="354.7" y="163.0">Shanghai last month.&quot;</text>
<text class="ts" x="344.7" y="195.0">revises: the Beijing memory (a hint)</text>
<rect class="frame" x="653.4" y="8" width="308.7" height="217" rx="10"/>
<circle class="numbg" cx="673.4" cy="29" r="11"/>
<text class="num" x="673.4" y="33.5" text-anchor="middle">3</text>
<text class="ftitle" x="691.4" y="34.0">The program checks</text>
<rect class="chipp" x="882.3" y="18" width="66" height="21" rx="10.5"/>
<text class="chippt" x="915.2" y="33.0" text-anchor="middle">program</text>
<rect class="hl" x="667.4" y="54" width="281" height="44" rx="4"/>
<text class="mono" x="675.4" y="72.0">I moved from Beijing to Shanghai</text>
<text class="mono" x="675.4" y="90.0">last month.</text>
<text class="tb" x="667.4" y="120.0">found at bytes [0, 44) of the message</text>
<text class="t" x="667.4" y="146.0">&quot;last month&quot;, said on 20 Nov</text>
<text class="tb" x="667.4" y="164.0">→ October 2026</text>
<text class="ts" x="667.4" y="190.0">Rule: a quote that is not in the</text>
<text class="ts" x="667.4" y="207.0">message is dropped. No quote, no fact.</text>
<rect class="frame" x="8.0" y="239" width="308.7" height="250" rx="10"/>
<circle class="numbg" cx="28.0" cy="260" r="11"/>
<text class="num" x="28.0" y="264.5" text-anchor="middle">4</text>
<text class="ftitle" x="46.0" y="265.0">Pick what to compare</text>
<rect class="chipp" x="236.9" y="249" width="66" height="21" rx="10.5"/>
<text class="chippt" x="269.8" y="264.0" text-anchor="middle">program</text>
<text class="tm" x="22.0" y="291.0">Stored memories about the user,</text>
<text class="tm" x="22.0" y="308.0">ranked by meaning and by words:</text>
<text class="ts" x="294.7" y="322.0" text-anchor="end">meaning · words</text>
<rect class="pick" x="22.0" y="328" width="281" height="24" rx="5"/>
<text class="t12" x="30.0" y="344.5">The user lives in Beijing.</text>
<text class="ts" x="294.7" y="345.0" text-anchor="end">#1 · #1</text>
<rect class="card" x="22.0" y="356" width="281" height="24" rx="5"/>
<text class="t12" x="30.0" y="372.5">The user works at Ruijin Hospital.</text>
<text class="ts" x="294.7" y="373.0" text-anchor="end">#2 · #4</text>
<rect class="card" x="22.0" y="384" width="281" height="24" rx="5"/>
<text class="t12" x="30.0" y="400.5">The user has a cat.</text>
<text class="ts" x="294.7" y="401.0" text-anchor="end">#3 · #2</text>
<rect class="card" x="22.0" y="412" width="281" height="24" rx="5"/>
<text class="t12" x="30.0" y="428.5">The user works as a nurse.</text>
<text class="ts" x="294.7" y="429.0" text-anchor="end">#4 · #3</text>
<text class="ts" x="22.0" y="454.0">+1 more. This input is saved first, so</text>
<text class="ts" x="22.0" y="471.0">the decision can be replayed.</text>
<rect class="frame" x="330.7" y="239" width="308.7" height="250" rx="10"/>
<circle class="numbg" cx="350.7" cy="260" r="11"/>
<text class="num" x="350.7" y="264.5" text-anchor="middle">5</text>
<text class="ftitle" x="368.7" y="265.0">The judge reviews</text>
<rect class="chipj" x="574.4" y="249" width="51" height="21" rx="10.5"/>
<text class="chipjt" x="599.9" y="264.0" text-anchor="middle">model</text>
<rect class="chipj" x="344.7" y="287" width="58" height="21" rx="10.5"/>
<text class="chipjt" x="373.9" y="302.0" text-anchor="middle">update</text>
<text class="t" x="410.1" y="302.0">The user lives in Beijing.</text>
<rect class="chipj" x="344.7" y="315" width="95" height="21" rx="10.5"/>
<text class="chipjt" x="392.4" y="330.0" text-anchor="middle">independent</text>
<text class="t" x="447.1" y="330.0">the other four</text>
<text class="tm" x="344.7" y="365.0">&quot;The quote states a move from</text>
<text class="tm" x="344.7" y="382.0">Beijing to Shanghai last month,</text>
<text class="tm" x="344.7" y="399.0">replacing the Beijing residence; …&quot;</text>
<text class="tb" x="344.7" y="429.0">Asked 3 times; all three said</text>
<text class="tb" x="344.7" y="446.0">update.</text>
<rect class="frame" x="653.4" y="239" width="308.7" height="250" rx="10"/>
<circle class="numbg" cx="673.4" cy="260" r="11"/>
<text class="num" x="673.4" y="264.5" text-anchor="middle">6</text>
<text class="ftitle" x="691.4" y="265.0">Write</text>
<rect class="chipp" x="882.3" y="249" width="66" height="21" rx="10.5"/>
<text class="chippt" x="915.2" y="264.0" text-anchor="middle">program</text>
<rect class="past" x="667.4" y="285" width="281" height="49" rx="6"/>
<text class="pastt" x="677.4" y="305.0">The user lives in Beijing.</text>
<text class="ts" x="677.4" y="322.0">now past · kept in history</text>
<path class="link" d="M693.4 338L693.4 362"/>
<text class="okt" x="703.4" y="355.0">superseded · from October 2026</text>
<rect class="new" x="667.4" y="366" width="281" height="66" rx="6"/>
<text class="t" x="677.4" y="386.0">The user moved from Beijing to</text>
<text class="t" x="677.4" y="403.0">Shanghai last month.</text>
<text class="okt" x="677.4" y="420.0">new · current</text>
